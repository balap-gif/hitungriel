<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
<title>Currency Converter | USD ⇄ IDR ⇄ KHR ⇄ THB</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Poppins', sans-serif;
    }

    body {
        background: radial-gradient(circle at 10% 30%, #0B1120, #030712);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 700px;
        background: rgba(18, 25, 45, 0.9);
        backdrop-filter: blur(12px);
        border-radius: 48px;
        padding: 28px 24px;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.12);
    }

    h1 {
        font-size: 24px;
        font-weight: 700;
        background: linear-gradient(135deg, #FFFFFF, #94A3F8);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        text-align: center;
        margin-bottom: 8px;
    }

    .datetime-box {
        background: #0F172A;
        padding: 8px 16px;
        border-radius: 40px;
        text-align: center;
        margin-bottom: 20px;
        border: 1px solid #334155;
    }

    .date { color: #94a3b8; font-size: 12px; }
    .time { color: #22c55e; font-size: 18px; font-weight: 700; font-family: monospace; }

    .rate-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 24px;
    }

    .rate-card {
        background: #0F172A;
        border-radius: 20px;
        padding: 12px;
        text-align: center;
        border: 1px solid rgba(34,197,94,0.3);
    }

    .rate-label { font-size: 11px; color: #9ca3af; margin-bottom: 6px; }
    .rate-value { font-size: 18px; font-weight: 800; color: #facc15; }
    .rate-source { font-size: 8px; color: #4b5563; margin-top: 4px; }

    .update-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #3B82F6, #2563EB);
        border: none;
        border-radius: 40px;
        color: white;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        margin-bottom: 24px;
    }

    .update-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; margin-bottom: 8px; color: #9ca3af; font-size: 13px; }

    select, input {
        width: 100%;
        padding: 14px 18px;
        background: #0F172A;
        border: 1px solid #334155;
        border-radius: 28px;
        color: white;
        font-size: 16px;
        outline: none;
    }

    select:focus, input:focus { border-color: #22c55e; }

    .convert-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(105deg, #22c55e, #15803d);
        border: none;
        border-radius: 60px;
        color: white;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
    }

    .hasil {
        margin-top: 24px;
        background: #0F172A;
        padding: 20px;
        border-radius: 28px;
        text-align: center;
        font-size: 18px;
        font-weight: 600;
        color: #e2e8f0;
        border: 1px solid rgba(34,197,94,0.3);
    }

    .last-updated {
        text-align: center;
        font-size: 10px;
        color: #6b7280;
        margin-top: 16px;
    }

    .status-success {
        color: #22c55e;
    }

    .status-warning {
        color: #facc15;
    }

    .status-error {
        color: #ef4444;
    }

    @media (max-width: 550px) {
        .rate-cards { grid-template-columns: 1fr; gap: 8px; }
        .rate-value { font-size: 16px; }
        h1 { font-size: 18px; }
    }

    .loading-spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
</head>
<body>

<div class="container">
    <h1>💱 USD ⇄ IDR ⇄ KHR ⇄ THB</h1>
    
    <div class="datetime-box">
        <div class="date" id="dateDisplay">--/--/----</div>
        <div class="time" id="timeDisplay">--:--:--</div>
    </div>

    <div class="rate-cards">
        <div class="rate-card">
            <div class="rate-label">🇺🇸 1 USD → 🇮🇩 RUPIAH</div>
            <div class="rate-value" id="rateIdr">17,640</div>
            <div class="rate-source">Sumber: Google Finance</div>
        </div>
        <div class="rate-card">
            <div class="rate-label">🇺🇸 1 USD → 🇰🇭 RIEL</div>
            <div class="rate-value" id="rateKhr">4,014</div>
            <div class="rate-source">Sumber: Google Finance</div>
        </div>
        <div class="rate-card">
            <div class="rate-label">🇺🇸 1 USD → 🇹🇭 BAHT</div>
            <div class="rate-value" id="rateThb">32.57</div>
            <div class="rate-source">Sumber: Google Finance</div>
        </div>
    </div>

    <button class="update-btn" id="updateBtn" onclick="updateAllRates()">
        🔄 Update Rate (Manual Update)
    </button>

    <div class="input-group">
        <label>📌 Pilih konversi</label>
        <select id="jenis">
            <option value="usdToIdr">🇺🇸 USD → 🇮🇩 RUPIAH (IDR)</option>
            <option value="idrToUsd">🇮🇩 RUPIAH → 🇺🇸 USD</option>
            <option value="usdToKhr">🇺🇸 USD → 🇰🇭 RIEL (KHR)</option>
            <option value="khrToUsd">🇰🇭 RIEL → 🇺🇸 USD</option>
            <option value="usdToThb">🇺🇸 USD → 🇹🇭 BAHT (THB)</option>
            <option value="thbToUsd">🇹🇭 BAHT → 🇺🇸 USD</option>
            <option value="idrToKhr">🇮🇩 RUPIAH → 🇰🇭 RIEL</option>
            <option value="khrToIdr">🇰🇭 RIEL → 🇮🇩 RUPIAH</option>
            <option value="idrToThb">🇮🇩 RUPIAH → 🇹🇭 BAHT</option>
            <option value="thbToIdr">🇹🇭 BAHT → 🇮🇩 RUPIAH</option>
            <option value="khrToThb">🇰🇭 RIEL → 🇹🇭 BAHT</option>
            <option value="thbToKhr">🇹🇭 BAHT → 🇰🇭 RIEL</option>
        </select>
    </div>

    <div class="input-group">
        <label>💸 Masukkan nominal</label>
        <input type="number" id="nominal" placeholder="0" step="any">
    </div>

    <button class="convert-btn" onclick="hitung()">✨ HITUNG KONVERSI ✨</button>

    <div class="hasil" id="hasil">💰 Hasil konversi akan muncul di sini</div>
    <div class="last-updated" id="lastUpdated">📊 Rate default: 19 Mei 2026</div>
</div>

<script>
    // ==================== RATE AKURAT (Default - 19 Mei 2026) ====================
    let usdToIdr = 17640;   // 1 USD = 17.640 IDR
    let usdToKhr = 4014;    // 1 USD = 4.014 KHR
    let usdToThb = 32.57;   // 1 USD = 32.57 THB
    
    let ratesLoaded = false;
    
    // ==================== TANGGAL & JAM ====================
    function updateDateTime() {
        const now = new Date();
        const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        
        document.getElementById('dateDisplay').innerHTML = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
        document.getElementById('timeDisplay').innerHTML = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    }
    
    // ==================== FORMAT ANGKA ====================
    function formatNumber(angka, decimals = 0) {
        if (isNaN(angka)) return '0';
        if (decimals === 2) {
            return angka.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        return Math.round(angka).toLocaleString('id-ID');
    }
    
    // ==================== AMBIL RATE DARI MULTIPLE API ====================
    async function fetchWithTimeout(url, timeout = 8000) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        try {
            const response = await fetch(url, { signal: controller.signal });
            clearTimeout(id);
            return response;
        } catch (error) {
            clearTimeout(id);
            throw error;
        }
    }
    
    async function fetchRateFromMultipleSources(fromCurrency, toCurrency) {
        // Daftar API yang akan dicoba (urutan prioritas)
        const apis = [
            {
                name: 'Frankfurter',
                url: `https://api.frankfurter.app/latest?from=${fromCurrency}&to=${toCurrency}`,
                parser: (data) => data.rates?.[toCurrency]
            },
            {
                name: 'ExchangeRate.host',
                url: `https://api.exchangerate.host/convert?from=${fromCurrency}&to=${toCurrency}`,
                parser: (data) => data.result
            }
        ];
        
        for (const api of apis) {
            try {
                console.log(`Mencoba ${api.name}...`);
                const response = await fetchWithTimeout(api.url, 5000);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const rate = api.parser(data);
                if (rate && rate > 0) {
                    console.log(`✅ ${api.name} berhasil: ${rate}`);
                    return rate;
                }
            } catch (error) {
                console.log(`❌ ${api.name} gagal:`, error.message);
            }
        }
        return null;
    }
    
    async function updateAllRates() {
        const btn = document.getElementById('updateBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="loading-spinner"></span> Mengambil rate live...';
        btn.disabled = true;
        
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
        const dateStr = `${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()}`;
        
        let successCount = 0;
        let errors = [];
        
        // Ambil USD ke IDR
        const idrRate = await fetchRateFromMultipleSources('USD', 'IDR');
        if (idrRate && idrRate > 0) {
            usdToIdr = idrRate;
            document.getElementById('rateIdr').innerHTML = formatNumber(usdToIdr, 0) + ' <small>Rp</small>';
            successCount++;
        } else {
            errors.push('IDR');
            document.getElementById('rateIdr').innerHTML = formatNumber(usdToIdr, 0) + ' <small>Rp (cached)</small>';
        }
        
        // Ambil USD ke KHR
        const khrRate = await fetchRateFromMultipleSources('USD', 'KHR');
        if (khrRate && khrRate > 0) {
            usdToKhr = khrRate;
            document.getElementById('rateKhr').innerHTML = formatNumber(usdToKhr, 0) + ' <small>៛</small>';
            successCount++;
        } else {
            errors.push('KHR');
            document.getElementById('rateKhr').innerHTML = formatNumber(usdToKhr, 0) + ' <small>៛ (cached)</small>';
        }
        
        // Ambil USD ke THB
        const thbRate = await fetchRateFromMultipleSources('USD', 'THB');
        if (thbRate && thbRate > 0) {
            usdToThb = thbRate;
            document.getElementById('rateThb').innerHTML = formatNumber(usdToThb, 2) + ' <small>฿</small>';
            successCount++;
        } else {
            errors.push('THB');
            document.getElementById('rateThb').innerHTML = formatNumber(usdToThb, 2) + ' <small>฿ (cached)</small>';
        }
        
        // Update last update display
        const lastUpdatedDiv = document.getElementById('lastUpdated');
        
        if (successCount === 3) {
            lastUpdatedDiv.innerHTML = `✅ Berhasil update: ${dateStr} ${timeStr} WIB | 1 USD = Rp ${formatNumber(usdToIdr, 0)} | ៛ ${formatNumber(usdToKhr, 0)} | ฿ ${formatNumber(usdToThb, 2)}`;
            lastUpdatedDiv.className = 'last-updated status-success';
            
            const hasilDiv = document.getElementById('hasil');
            hasilDiv.innerHTML = `✅ Rate berhasil diperbarui! 1 USD = Rp ${formatNumber(usdToIdr, 0)} | ៛ ${formatNumber(usdToKhr, 0)} | ฿ ${formatNumber(usdToThb, 2)}`;
            setTimeout(() => {
                const nominal = document.getElementById('nominal').value;
                if (nominal && parseFloat(nominal) > 0) {
                    hitung();
                } else {
                    hasilDiv.innerHTML = '💰 Hasil konversi akan muncul di sini';
                }
            }, 2000);
        } else if (successCount > 0) {
            lastUpdatedDiv.innerHTML = `⚠️ Sebagian berhasil: ${dateStr} ${timeStr} | 1 USD = Rp ${formatNumber(usdToIdr, 0)} | ៛ ${formatNumber(usdToKhr, 0)} | ฿ ${formatNumber(usdToThb, 2)}`;
            lastUpdatedDiv.className = 'last-updated status-warning';
            
            const hasilDiv = document.getElementById('hasil');
            hasilDiv.innerHTML = `⚠️ Sebagian rate gagal update (${errors.join(', ')}). Menggunakan rate tersimpan.`;
            setTimeout(() => {
                const nominal = document.getElementById('nominal').value;
                if (nominal && parseFloat(nominal) > 0) {
                    hitung();
                } else {
                    hasilDiv.innerHTML = '💰 Hasil konversi akan muncul di sini';
                }
            }, 2000);
        } else {
            lastUpdatedDiv.innerHTML = `❌ Gagal mengambil rate online. Menggunakan rate tersimpan (19 Mei 2026)`;
            lastUpdatedDiv.className = 'last-updated status-error';
            
            const hasilDiv = document.getElementById('hasil');
            hasilDiv.innerHTML = '❌ Gagal mengambil rate online. Gunakan rate manual di bawah atau coba lagi nanti.';
            setTimeout(() => {
                const nominal = document.getElementById('nominal').value;
                if (nominal && parseFloat(nominal) > 0) {
                    hitung();
                }
            }, 2000);
        }
        
        // Auto hitung ulang
        const nominal = parseFloat(document.getElementById('nominal').value);
        if (!isNaN(nominal) && nominal > 0) {
            setTimeout(() => hitung(), 100);
        }
        
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
    
    // ==================== FUNGSI HITUNG KONVERSI ====================
    function hitung() {
        let nominal = parseFloat(document.getElementById('nominal').value);
        let jenis = document.getElementById('jenis').value;
        
        if (isNaN(nominal) || nominal <= 0) {
            document.getElementById('hasil').innerHTML = '⚠️ Masukkan nominal yang valid (> 0)';
            return;
        }
        
        let hasil = 0;
        let text = '';
        
        switch(jenis) {
            case 'usdToIdr':
                hasil = nominal * usdToIdr;
                text = `💵 $${formatNumber(nominal, 2)} USD = Rp ${formatNumber(hasil)} IDR`;
                break;
            case 'idrToUsd':
                hasil = nominal / usdToIdr;
                text = `Rp ${formatNumber(nominal)} IDR = $${formatNumber(hasil, 2)} USD`;
                break;
            case 'usdToKhr':
                hasil = nominal * usdToKhr;
                text = `💵 $${formatNumber(nominal, 2)} USD = ៛ ${formatNumber(hasil)} KHR`;
                break;
            case 'khrToUsd':
                hasil = nominal / usdToKhr;
                text = `៛ ${formatNumber(nominal)} KHR = $${formatNumber(hasil, 2)} USD`;
                break;
            case 'usdToThb':
                hasil = nominal * usdToThb;
                text = `💵 $${formatNumber(nominal, 2)} USD = ฿ ${formatNumber(hasil, 2)} THB`;
                break;
            case 'thbToUsd':
                hasil = nominal / usdToThb;
                text = `฿ ${formatNumber(nominal, 2)} THB = $${formatNumber(hasil, 2)} USD`;
                break;
            case 'idrToKhr':
                let usdFromIdr = nominal / usdToIdr;
                hasil = usdFromIdr * usdToKhr;
                text = `Rp ${formatNumber(nominal)} IDR = ៛ ${formatNumber(hasil)} KHR`;
                break;
            case 'khrToIdr':
                let usdFromKhr = nominal / usdToKhr;
                hasil = usdFromKhr * usdToIdr;
                text = `៛ ${formatNumber(nominal)} KHR = Rp ${formatNumber(hasil)} IDR`;
                break;
            case 'idrToThb':
                let usdFromIdr2 = nominal / usdToIdr;
                hasil = usdFromIdr2 * usdToThb;
                text = `Rp ${formatNumber(nominal)} IDR = ฿ ${formatNumber(hasil, 2)} THB`;
                break;
            case 'thbToIdr':
                let usdFromThb = nominal / usdToThb;
                hasil = usdFromThb * usdToIdr;
                text = `฿ ${formatNumber(nominal, 2)} THB = Rp ${formatNumber(hasil)} IDR`;
                break;
            case 'khrToThb':
                let usdFromKhr2 = nominal / usdToKhr;
                hasil = usdFromKhr2 * usdToThb;
                text = `៛ ${formatNumber(nominal)} KHR = ฿ ${formatNumber(hasil, 2)} THB`;
                break;
            case 'thbToKhr':
                let usdFromThb2 = nominal / usdToThb;
                hasil = usdFromThb2 * usdToKhr;
                text = `฿ ${formatNumber(nominal, 2)} THB = ៛ ${formatNumber(hasil)} KHR`;
                break;
            default:
                text = 'Pilihan tidak valid';
        }
        
        document.getElementById('hasil').innerHTML = text;
    }
    
    // ==================== EVENT LISTENERS ====================
    document.getElementById('nominal').addEventListener('input', () => {
        if (document.getElementById('nominal').value && parseFloat(document.getElementById('nominal').value) > 0) {
            hitung();
        }
    });
    
    document.getElementById('jenis').addEventListener('change', () => {
        if (document.getElementById('nominal').value && parseFloat(document.getElementById('nominal').value) > 0) {
            hitung();
        }
    });
    
    document.getElementById('nominal').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') hitung();
    });
    
    // ==================== INISIALISASI ====================
    updateDateTime();
    setInterval(updateDateTime, 1000);
    
    // Tampilkan rate default
    document.getElementById('rateIdr').innerHTML = formatNumber(usdToIdr, 0) + ' <small>Rp</small>';
    document.getElementById('rateKhr').innerHTML = formatNumber(usdToKhr, 0) + ' <small>៛</small>';
    document.getElementById('rateThb').innerHTML = formatNumber(usdToThb, 2) + ' <small>฿</small>';
    
    // Coba ambil rate live saat load
    setTimeout(() => {
        updateAllRates();
    }, 500);
</script>
</body>
</html>
<script>
document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', function(e) {
    if (e.key === 'F12') e.preventDefault();
    if (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) e.preventDefault();
    if (e.ctrlKey && e.key.toUpperCase() === 'U') e.preventDefault();
});

setInterval(() => {
    const before = new Date();
    debugger;
    const after = new Date();
    if (after - before > 100) {
        document.body.innerHTML = '<h1 style="text-align:center;margin-top:50px;">Akses ditolak</h1>';
    }
}, 1000);
</script>
